<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FlashLearn | Enterprise Academic Spaced-Repetition Platform</title>
  <meta name="description" content="FlashLearn - Enterprise-grade active recall flashcards, real-time cohort analytics, and AI-powered curriculum management." />
  <link rel="icon" type="image/png" href="images/memoflip_logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="landing-container"></div>
  <div id="auth-container"></div>
  <div id="dashboard-container"></div>
  <div id="modals-container"></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="js/landing.js"></script>
  <script src="js/app.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/student.js"></script>
  <script src="js/study.js"></script>
  <script src="js/exam.js"></script>

  <script>
    async function loadPageFragments() {
      const fragments = [
        ['landing-container', '/pages/landing.html'],
        ['auth-container', '/pages/auth.html'],
        ['dashboard-container', '/pages/dashboard.html'],
        ['modals-container', '/pages/modals.html']
      ];

      await Promise.all(fragments.map(async ([containerId, url]) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to load ${url}`);
        document.getElementById(containerId).innerHTML = await response.text();
      }));
    }
    function showLandingView() {
      localStorage.setItem('currentView', 'landing');
      document.getElementById('landing-view').style.display = 'flex';
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'none';
      closeMobileSidebar();
      closeMobileNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAuthView(tab = 'login') {
      localStorage.setItem('currentView', 'auth:' + tab);
      document.getElementById('landing-view').style.display = 'none';
      document.getElementById('auth-view').style.display = 'flex';
      document.getElementById('dashboard-view').style.display = 'none';
      closeMobileSidebar();
      closeMobileNav();
      toggleAuthTab(tab);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startGoogleAuth() {
      window.location.href = '/api/auth/google';
    }

    async function handleForgotPassword(event) {
      event.preventDefault();
      const email = document.getElementById('forgot-password-email').value.trim();
      const res = await fetch('/api/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const data = await res.json();
      closeModal('modal-forgot-password');
      showToast(data.dev_reset_link ? `Development reset link: ${data.dev_reset_link}` : data.message, res.ok ? 'success' : 'error');
    }

    async function handleResetPassword(event) {
      event.preventDefault();
      const token = new URLSearchParams(window.location.search).get('reset_token');
      const password = document.getElementById('reset-password').value;
      const confirmPassword = document.getElementById('reset-confirm-password').value;
      const res = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password, confirm_password: confirmPassword }) });
      const data = await res.json();
      closeModal('modal-reset-password');
      showToast(data.message || data.error, res.ok ? 'success' : 'error');
      if (res.ok) window.history.replaceState({}, document.title, window.location.pathname);
    }

    function switchTab(tabKey) {
      localStorage.setItem('currentView', 'tab:' + tabKey);
      document.getElementById('landing-view').style.display = 'none';
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'flex';

      document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

      const targetPanel = document.getElementById(`panel-${tabKey}`);
      const targetNav = document.getElementById(`nav-${tabKey}`);

      if (targetPanel) targetPanel.classList.add('active');
      if (targetNav) targetNav.classList.add('active');

      if (tabKey === 'admin-requests') loadAdminTeacherRequests();
      if (tabKey === 'admin-logins') loadAdminLoginHistory();
      if (tabKey === 'teacher-dashboard') renderTeacherDashboard();
      if (tabKey === 'teacher-myclasses') renderMyClassesPanel();
      if (tabKey === 'teacher-classrooms') renderTeacherClassrooms();
      if (tabKey === 'student-dashboard') renderStudentDashboard();
      if (tabKey === 'student-mistakes') renderMistakeBook();
      if (tabKey === 'student-classrooms') renderStudentClassrooms();
      if (tabKey === 'student-decks') renderStudentDecks(activeStudentDeckFilter || 'all');
      if (tabKey === 'student-streaks') renderDailyStreakGame();
      if (tabKey === 'student-exam') renderStudentExamPrep();
      if (tabKey === 'profile') renderProfileView();

      closeMobileSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMobileNav() {
      const links = document.getElementById('landing-nav-links');
      if (links) links.classList.toggle('mobile-open');
    }

    function closeMobileNav() {
      const links = document.getElementById('landing-nav-links');
      if (links) links.classList.remove('mobile-open');
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (sidebar) sidebar.classList.toggle('mobile-open');
      if (backdrop) backdrop.classList.toggle('active');
    }

    function closeMobileSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (sidebar) sidebar.classList.remove('mobile-open');
      if (backdrop) backdrop.classList.remove('active');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadPageFragments();
      // 1. Instantly apply theme from localStorage to avoid flashing wrong theme
      const savedTheme = localStorage.getItem('theme');
      const isDark = savedTheme === 'dark';
      document.body.classList.toggle('dark-theme', isDark);
      syncThemeUI(isDark);

      await state.loadState();

      // Sync theme classes if state theme differs (and user is logged in)
      if (state.data.currentUser && state.data.theme) {
        const serverDark = state.data.theme === 'dark';
        document.body.classList.toggle('dark-theme', serverDark);
        localStorage.setItem('theme', state.data.theme);
        syncThemeUI(serverDark);
      }

      const currentView = localStorage.getItem('currentView');

      if (new URLSearchParams(window.location.search).get('reset_token')) {
        openModal('modal-reset-password');
      }

      if (state.data.currentUser) {
        updateAppAuthUI(true); // skip default tab switching

        const role = state.data.currentUser.role;
        const isAdmin = role === 'admin';
        const isTeacher = role === 'teacher';

        // Restore view if it was a dashboard tab
        if (currentView && currentView.startsWith('tab:')) {
          const tabKey = currentView.split(':')[1];
          const isAdminTab = tabKey.startsWith('admin-');
          const isTeacherTab = tabKey.startsWith('teacher-');
          const isStudentTab = tabKey.startsWith('student-');

          if ((isAdmin && (isAdminTab || isTeacherTab)) || (isTeacher && isTeacherTab) || (!isTeacher && !isAdmin && isStudentTab) || tabKey === 'profile') {
            switchTab(tabKey);
          } else {
            switchTab(isAdmin ? 'admin-requests' : (isTeacher ? 'teacher-dashboard' : 'student-dashboard'));
          }
        } else {
          switchTab(isAdmin ? 'admin-requests' : (isTeacher ? 'teacher-dashboard' : 'student-dashboard'));
        }
      } else {
        if (currentView && currentView.startsWith('auth:')) {
          const tab = currentView.split(':')[1];
          showAuthView(tab);
        } else {
          showLandingView();
        }
      }
    });
  </script>
</body>

</html>
